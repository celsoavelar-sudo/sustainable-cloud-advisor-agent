name: ADK Agent CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --locked
      - name: Run test suite
        env:
          PYTHONPATH: .
        run: uv run pytest -v
